.dashboard-workspace {
  --ledger-ink: #20372b;
  --ledger-muted: #536154;
  --ledger-rule: #c8c6b6;
  --ledger-paper: #f5f3e9;
  --ledger-plate: #eaece0;
  --ledger-green: #205641;
  --ledger-oxblood: #762e3b;
  font-variant-numeric: tabular-nums;
  color: var(--ledger-ink);
}

.dashboard-masthead,
.dashboard-heading,
.dashboard-grid-heading,
.dashboard-section-heading {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px 20px;
}

.dashboard-masthead { padding: 2px 0 20px; margin-bottom: 19px; border-bottom: 2px solid var(--ledger-ink); }
.dashboard-masthead h1 { font: 400 clamp(43px, 5.65vw, 88px)/.99 var(--display, Georgia, serif); letter-spacing: -.055em; margin: 0; }
.dashboard-masthead p { margin: 8px 0 0; color: var(--ledger-muted); font-size: 14px; }
.dashboard-masthead nav { display: flex; flex-wrap: wrap; column-gap: 22px; }
.dashboard-masthead a { display: inline-flex; min-height: 44px; align-items: center; color: var(--ledger-green); text-decoration: underline; text-underline-offset: 4px; }

.dashboard-workspace :is(h2, h3, h4) { color: var(--ledger-ink); }
.dashboard-workspace :is(.dashboard-heading h2, .dashboard-section-heading h2, .dashboard-bottom-layout h2) {
  font: 400 clamp(24px, 2.2vw, 35px)/1.1 var(--display, Georgia, serif);
  letter-spacing: -.025em;
  margin: 0 0 5px;
}
.dashboard-heading p, .dashboard-grid-heading p { margin: 0; color: var(--ledger-muted); font-size: 13px; }

.dashboard-year-filter {

.dashboard-stats {

}

.dashboard-stat strong { display: block; color: var(--ledger-ink); font: 400 clamp(24px, 3.2vw, 45px)/1.17 var(--display, Georgia, serif); white-space: normal; }
.dashboard-stat:last-child strong { color: var(--ledger-oxblood); font-size: clamp(21px, 2.35vw, 34px); }

.dashboard-scope { margin: 0 0 12px; }

.dashboard-charts {

}

.dashboard-charts .dashboard-chart:last-child { border-top: 1px solid var(--ledger-rule); }
.ledger-chart-empty { color: var(--ledger-muted); margin: 15px 0; font-size: 13px; }
.ledger-sr-only { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }

.ledger-bars { flex: 1; display: grid; align-content: center; margin-top: 9px; gap: 13px; }
.ledger-bars > ul, .ledger-key { list-style: none; padding: 0; margin: 0; }
.ledger-bar-axis, .ledger-bar-row {
  display: grid;
  grid-template-columns: minmax(35px, 13%) 1fr minmax(33px, 10%);
  gap: clamp(8px, 1.8vw, 18px);
  align-items: center;
}
.ledger-bar-axis { color: var(--ledger-muted); font-size: 11px; }
.ledger-bar-axis > div { display: flex; justify-content: space-between; }
.ledger-bar-axis > span:last-child { text-align: right; }
.ledger-bars > ul:first-of-type { display: grid; gap: clamp(9px, 2.4vh, 23px); }
.ledger-bar-row {
  width: 100%; min-height: 40px; padding: 0; border: 0; border-radius: 1px;

}
.ledger-bar-row:hover:not(:disabled) { filter: none; }
.ledger-bar-row[data-inspected] { background: #d7dfcc; outline: 1px solid #899a7d; outline-offset: 2px; }
.ledger-bar-row:focus-visible { outline: 2px solid var(--ledger-green); }
.ledger-bar-row > strong { text-align: right; }
.ledger-bar-ink { display: flex; width: 100%; height: 100%; transform-origin: left center; }
.ledger-bar-track {
  display: flex;
  min-width: 0;
  height: clamp(24px, 3.7vh, 39px);
  background: repeating-linear-gradient(90deg, #7d8e792b 0 1px, transparent 1px 25%);
  border-right: 1px solid #7d8e792b;
}
.ledger-bar-mark { display: grid; place-items: center; min-width: 0; color: #fff; font-size: 11px; }
.ledger-bar-mark b { overflow: hidden; }
.ledger-bar-mark[data-outcome="PENDING"] { color: #241900; }
.ledger-key { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ledger-ink); font-size: 12px; }
.ledger-key li { display: flex; align-items: center; gap: 6px; }
.ledger-key li > span:first-child { display: inline-block; flex: 0 0 9px; height: 9px; }
.ledger-bars > .ledger-key { margin-top: 3px; }
.ledger-rate-plot { display: block; width: 100%; max-height: 165px; overflow: visible; }
.ledger-rate-plot text { fill: var(--ledger-muted); font-size: 10px; }
.ledger-rate-plot line { stroke: var(--ledger-rule); stroke-width: 1; }
.ledger-rate-plot path { stroke: var(--ledger-oxblood); stroke-width: 2.5; fill: none; }
.ledger-rate-plot circle { fill: var(--ledger-oxblood); stroke: var(--ledger-paper); stroke-width: 1.3; }
.ledger-rate-plot .ledger-rate-halo { fill: none; stroke: var(--ledger-oxblood); stroke-width: 1.2; }
.ledger-rate-plot [data-inspected] text { fill: var(--ledger-oxblood); font-weight: 700; }
.ledger-rate-caption { color: var(--ledger-muted); font-size: 12px; margin: 2px 0 0; min-height: 2.8em; }
.ledger-mix { display: grid; grid-template-columns: clamp(76px, 8vw, 118px) minmax(0, 1fr); gap: clamp(12px, 2vw, 26px); align-items: center; }
.ledger-donut { display: grid; aspect-ratio: 1; place-items: center; border-radius: 50%; }
.ledger-donut span { display: grid; width: 71%; height: 71%; place-items: center; border-radius: 50%; background: var(--ledger-paper); font: 400 25px/1 var(--display, Georgia, serif); }
.ledger-mix .ledger-key { display: grid; }
.ledger-mix .ledger-key li strong { margin-left: auto; }

@media (prefers-reduced-motion: no-preference) {
  .dashboard-chart[data-chart-revealed="false"] :is(.ledger-bar-ink,.ledger-rate-plot path,.ledger-rate-plot circle,.ledger-donut) { opacity: 0; }
  .dashboard-chart[data-chart-revealed="true"] .ledger-bar-ink {
    animation: ledger-imprint 540ms cubic-bezier(.2,.74,.24,1) backwards;
    animation-delay: calc(var(--row-index,0) * 65ms);
  }
  .dashboard-chart[data-chart-revealed="true"] .ledger-rate-plot path {
    stroke-dasharray: 1;
    animation: ledger-trace 440ms ease-out backwards;
    animation-delay: calc(var(--point-index,0) * 95ms);
  }
  .dashboard-chart[data-chart-revealed="true"] .ledger-donut { animation: ledger-ring 640ms cubic-bezier(.2,.76,.3,1) backwards; }
  .public-demo-notice ~ main:not([hidden]) :is(.dashboard-masthead,.workbench-title),
  .public-demo-notice ~ main:not([hidden]) .handoff-card { animation: ledger-page 300ms ease-out backwards; }
  .granted-embedded #root[data-room-entered="false"] .public-demo-notice ~ main :is(.dashboard-masthead,.workbench-title) { animation: none; opacity: .18; transform: translateY(16px); }
}
@keyframes ledger-imprint { from { transform: scaleX(.04); opacity: .12; } to { transform: scaleX(1); opacity: 1; } }
@keyframes ledger-trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes ledger-ring { from { transform: rotate(-35deg) scale(.83); opacity: .15; } to { transform: none; opacity: 1; } }
@keyframes ledger-page { from { opacity: .18; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.grant-workspace {

.grant-workspace .comparator-grid ul > li { background: var(--folio-paper); border-radius: 0; }
.grant-workspace .comparator-evidence summary, .grant-workspace .comparator-evidence p { font-size: 12px; }

.answer-heading { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 24px; }
.answer-heading p { max-width: 49ch; }
.answer-question {
  display: grid;
  gap: 6px;
  margin: 0 0 20px;
  padding: 16px 20px;
  border-left: 4px solid #987114;
  background: #f8edc9;
  font: 400 clamp(19px, 2vw, 26px)/1.38 var(--display);
  white-space: pre-line;
}
.answer-question span { font: 650 12px/1.5 var(--font); }
.grant-workspace .context-panel {
  margin: 0 0 22px;
  padding: 11px 0;
  border: solid var(--folio-line);
  border-width: 1px 0;
  border-radius: 0;
  background: transparent;
}
.grant-workspace .context-panel > summary { padding: 5px 0; }
.grant-workspace .editor-grid { gap: 0; align-items: stretch; border: 1px solid var(--folio-line); }
.grant-workspace .editor-panel { border: 0; border-radius: 0; box-shadow: none; background: var(--folio-paper); }
.grant-workspace .editor-panel + .editor-panel { border-left: 1px solid var(--folio-line); }
.grant-workspace .editor-panel > .panel-heading {
  min-height: 66px;
  padding: 15px clamp(17px, 2vw, 29px);
  border-bottom: 1px solid var(--folio-line);
  background: var(--folio-accent);
}
.grant-workspace .revision-panel > .panel-heading { background: var(--folio-note); }
.grant-workspace .editor-panel .panel-heading h3 { margin: 0; font: 400 clamp(21px, 2.05vw, 33px)/1.2 var(--display); }
.grant-workspace .writing-area { display: block; min-height: 260px; background: var(--folio-paper); font: 400 16px/1.72 var(--font); }
.grant-workspace .editor-meta { background: #f3f1e6; color: var(--folio-ink); border-color: var(--folio-line); }
.grant-workspace .editor-controls { flex-wrap: wrap; }
.grant-workspace .tool-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grant-workspace .tool-grid button { min-height: 52px; text-align: left; padding: 8px 10px; }
.grant-workspace .tool-grid button span { font-size: 11px; line-height: 1.3; }
.grant-workspace .chain-help { margin: 0 24px 18px; color: var(--muted); }
.grant-workspace .chain-help p { font-size: 13px; }
.grant-workspace .writing-result-controls { background: var(--folio-paper); border-color: var(--folio-line); }
.grant-workspace .revision-panel { scroll-margin-top: 64px; }
.grant-workspace .revision-panel .empty-state { padding: 32px 24px; min-height: 200px; text-align: left; }
.grant-workspace .empty-symbol { display: none; }
.grant-workspace .empty-state h3 { margin: 0 0 6px; font: italic 400 24px/1.2 var(--display); }
.grant-workspace .empty-state p { margin: 0; font-size: 14px; line-height: 1.6; }
.grant-workspace .workbench-preview-note { margin: 0 24px 17px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.grant-workspace .match-preview-note { margin: -7px 0 24px; max-width: 55ch; color: var(--muted); line-height: 1.55; }
.match-preview-note p { margin: 0; }
.grant-workspace .example-brief { display: inline-flex; align-items: center; gap: 12px; margin-top: 9px; padding: 6px 10px; color: var(--folio-ink); border: 1px solid var(--control-border); background: #f4edd3; }
.example-brief span { font-size: 15px; }
.grant-workspace .export-actions { margin-top: 0; }

@media (max-width: 840px) {
  .workbench-title { grid-template-columns: minmax(0,1fr); gap: 12px; }
  .workbench-title p { max-width: 52ch; }
  .grant-workspace .match-layout { grid-template-columns: minmax(0,1fr); }
  .grant-workspace .matching-guide { position: static; border-top-width: 1px; }
  .matching-guide dl { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
  .matching-guide dl > div { border: 0; padding: 0; }
}
@media (max-width: 780px) {
  .grant-workspace .editor-grid { grid-template-columns: minmax(0,1fr); }
  .grant-workspace .editor-panel + .editor-panel { border-left: 0; border-top: 1px solid var(--folio-line); }
}
@media (max-width: 560px) {
  .workbench-file { padding: 21px 14px; }
  .workbench-index a { flex: 1; font-size: 13px; gap: 3px; padding-inline: 9px; }
  .grant-workspace .matching-guide h3 { font-size: 23px; }
  .matching-guide dl { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .matching-guide dl > div { display: grid; grid-template-columns: 5.15em minmax(0,1fr); gap: 8px; }
  .matching-guide dd { margin-top: 0; }
  .grant-workspace .editor-panel .chain-help, .grant-workspace .workbench-preview-note { margin-inline: 17px; }
}
</style>
