.dashboard-workspace {
  --ledger-ink: #20372b;
  --ledger-muted: #536154;
  --ledger-rule: #c8c6b6;
  --ledger-paper: #f5f3e9;
  --ledger-plate: #eaece0;
  --ledger-green: #205641;
  --ledger-oxblood: #762e3b;
  font-variant-numeric: tabular-nums;
  color: var(--ledger-ink);
}

.dashboard-masthead,
.dashboard-heading,
.dashboard-grid-heading,
.dashboard-section-heading {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px 20px;
}

.dashboard-masthead { padding: 2px 0 20px; margin-bottom: 19px; border-bottom: 2px solid var(--ledger-ink); }
.dashboard-masthead h1 { font: 400 clamp(43px, 5.65vw, 88px)/.99 var(--display, Georgia, serif); letter-spacing: -.055em; margin: 0; }
.dashboard-masthead p { margin: 8px 0 0; color: var(--ledger-muted); font-size: 14px; }
.dashboard-masthead nav { display: flex; flex-wrap: wrap; column-gap: 22px; }
.dashboard-masthead a { display: inline-flex; min-height: 44px; align-items: center; color: var(--ledger-green); text-decoration: underline; text-underline-offset: 4px; }

.dashboard-workspace :is(h2, h3, h4) { color: var(--ledger-ink); }
.dashboard-workspace :is(.dashboard-heading h2, .dashboard-section-heading h2, .dashboard-bottom-layout h2) {
  font: 400 clamp(24px, 2.2vw, 35px)/1.1 var(--display, Georgia, serif);
  letter-spacing: -.025em;
  margin: 0 0 5px;
}
.dashboard-heading p, .dashboard-grid-heading p { margin: 0; color: var(--ledger-muted); font-size: 13px; }

.dashboard-grid { height: 545px; width: 100%; margin: 8px 0 14px; }

.dashboard-deep-dive { border-top: 2px solid var(--ledger-ink); padding-top: 18px; margin-top: 24px; }

.dashboard-diction select { max-width: 480px; margin-bottom: 16px; }

.dashboard-measure-values { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 7px 12px; font-size: 12px; }
.dashboard-measure-values dt { color: var(--ledger-muted); }
.dashboard-measure-values dd { margin: 0; overflow-wrap: anywhere; font-weight: 650; }
.dashboard-sensitivities { padding: 8px 0; border-block: 1px solid var(--ledger-rule); font-size: 13px; line-height: 1.6; margin: 12px 0; }
.dashboard-sensitivities > summary { color: var(--ledger-green); }
.dashboard-sensitivities details, .dashboard-common-support { padding: 7px 0 9px; border-bottom: 1px solid var(--ledger-rule); }

.dashboard-relationship-contrast { margin-top: 17px; }

.dashboard-bottom-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(250px, 1fr); gap: clamp(20px, 4vw, 68px); align-items: start; margin-top: 27px; }
.dashboard-pinned-panel, .dashboard-question-panel { border-top: 2px solid var(--ledger-ink); padding-top: 15px; min-width: 0; }

.dashboard-pinned-list > li.insight { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 11px; align-items: start; padding: 10px 0; border-top: 1px solid var(--ledger-rule); }

.dashboard-answer-rates span { font-size: 13px; line-height: 1.6; }
.dashboard-answer-rates small { font-size: 11px; margin-top: 4px; color: var(--ledger-muted); }
.dashboard-key-limits { font-size: 13px; margin-top: 12px; }
.dashboard-verified-details p { font-size: 13px; line-height: 1.6; margin-top: 8px; }

@media (max-width: 890px) {
  .dashboard-charts { column-gap: 16px; grid-template-columns: minmax(0, 1.5fr) minmax(205px, 1fr); }

}

@media (max-width: 660px) {
  .app-body:has(> #panel-dashboard:not([hidden])) { padding-top: 17px; }

  .dashboard-year-filter button { margin-left: 0; }

  .ledger-mix { max-width: 345px; }
  .ledger-record-controls { column-gap: 12px; }
  .ledger-record-controls label { flex: 1 1 120px; }
  .ledger-record-controls > span { margin-left: 0; }
  .dashboard-grid { height: 460px; }
  .dashboard-answer-rates { grid-template-columns: 1fr; }
}

.grant-workspace {
  --folio-ink: #23392c;
  --folio-paper: #fffdf5;
  --folio-line: #b9bfab;
  --folio-accent: #d8e7b5;
  --folio-note: #f0e0ac;
  width: 100%;
  min-width: 0;
  color: var(--folio-ink);
}

.workbench-title {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(240px, .75fr);
  align-items: end;
  gap: 24px;
  padding: 12px 0 clamp(24px, 4vw, 56px);
}

.grant-workspace .workbench-title h1 {
  margin: 0;
  max-width: 10em;
  font: 400 clamp(48px, 6vw, 92px)/.97 var(--display);
  letter-spacing: -.06em;
  color: var(--folio-ink);
}

.workbench-title p, .answer-heading p {
  max-width: 37ch;
  margin: 0;
  font-size: clamp(14px, 1.25vw, 17px);
  line-height: 1.55;
}

.workbench-index {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  gap: 5px;
  align-items: end;
  padding-top: 5px;
  border-bottom: 2px solid var(--folio-ink);
  background: var(--bg);
}

.workbench-index a {
  display: inline-flex;
  gap: clamp(8px, 3vw, 44px);
  align-items: center;
  justify-content: space-between;
  min-height: 46px;
  padding: 9px clamp(12px, 1.7vw, 26px);
  border: 1px solid var(--folio-line);
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
  background: var(--folio-paper);
  color: var(--folio-ink);
  font-size: 14px;
  font-weight: 650;
  text-decoration: none;
}

.workbench-index a[aria-current] {
  border-color: var(--folio-ink);
  background: var(--folio-ink);
  color: #fffdf5;
}
.workbench-index a:hover { text-decoration: underline; text-underline-offset: 3px; }
.workbench-index a:focus-visible { outline-offset: -4px; outline-color: currentColor; }
.workbench-index a span { font-size: 18px; font-weight: 400; line-height: 1; }

.workbench-file {
  min-width: 0;
  scroll-margin-top: 58px;

  background: var(--folio-paper);
}

.workbench-file:focus-visible { outline-offset: -4px; }
.workbench-file + .workbench-file { border-top: 3px double var(--folio-ink); }
.grant-workspace .match-layout {

}
.grant-workspace .field label { color: var(--folio-ink); font-size: 13px; }

.grant-workspace .empty-symbol { display: none; }
.grant-workspace .empty-state h3 { margin: 0 0 6px; font: italic 400 24px/1.2 var(--display); }
.grant-workspace .empty-state p { margin: 0; font-size: 14px; line-height: 1.6; }
.grant-workspace .workbench-preview-note { margin: 0 24px 17px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.grant-workspace .match-preview-note { margin: -7px 0 24px; max-width: 55ch; color: var(--muted); line-height: 1.55; }
.match-preview-note p { margin: 0; }
.grant-workspace .example-brief { display: inline-flex; align-items: center; gap: 12px; margin-top: 9px; padding: 6px 10px; color: var(--folio-ink); border: 1px solid var(--control-border); background: #f4edd3; }
.example-brief span { font-size: 15px; }
.grant-workspace .export-actions { margin-top: 0; }

@media (max-width: 840px) {
  .workbench-title { grid-template-columns: minmax(0,1fr); gap: 12px; }
  .workbench-title p { max-width: 52ch; }
  .grant-workspace .match-layout { grid-template-columns: minmax(0,1fr); }
  .grant-workspace .matching-guide { position: static; border-top-width: 1px; }
  .matching-guide dl { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
  .matching-guide dl > div { border: 0; padding: 0; }
}
@media (max-width: 780px) {
  .grant-workspace .editor-grid { grid-template-columns: minmax(0,1fr); }
  .grant-workspace .editor-panel + .editor-panel { border-left: 0; border-top: 1px solid var(--folio-line); }
}
@media (max-width: 560px) {
  .workbench-file { padding: 21px 14px; }
  .workbench-index a { flex: 1; font-size: 13px; gap: 3px; padding-inline: 9px; }
  .grant-workspace .matching-guide h3 { font-size: 23px; }
  .matching-guide dl { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .matching-guide dl > div { display: grid; grid-template-columns: 5.15em minmax(0,1fr); gap: 8px; }
  .matching-guide dd { margin-top: 0; }
  .grant-workspace .editor-panel .chain-help, .grant-workspace .workbench-preview-note { margin-inline: 17px; }
}
</style>
